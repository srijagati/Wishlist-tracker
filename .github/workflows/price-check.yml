name: Daily price check

on:
  schedule:
    # 13:00 UTC daily. Change this if you want a different time -
    # https://crontab.guru is handy for editing cron schedules.
    - cron: "0 13 * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

permissions:
  contents: write # needed to commit the updated price-state.json back

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tracked prices
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python3 scripts/check_prices.py

      - name: Commit updated price state
        run: |
          git config user.name "price-tracker-bot"
          git config user.email "actions@github.com"
          git add data/price-state.json
          git diff --cached --quiet || git commit -m "Update tracked prices [skip ci]"
          git push
